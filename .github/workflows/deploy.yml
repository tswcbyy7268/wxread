name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: false    # 取消任何正在进行的相同并发组的工作流

on:
  # Daily reading migrated to the Ubuntu systemd timer; manual cloud runs remain available.
  workflow_dispatch:
    inputs:
      read_num:
        description: 'Reading requests: 40 = 20 minutes, 360 = 3 hours'
        required: true
        default: '360'
        type: string
      read_until:
        description: 'Optional UTC Unix timestamp to stop reading'
        required: false
        default: ''
        type: string
      verify_stats:
        description: 'Verify 5 minutes first, then report actual official duration'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Verify automatic recovery
      run: python -m unittest discover -s tests -v

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_UNTIL: ${{ inputs.read_until }}
        READ_NUM: ${{ inputs.read_num || vars.READ_NUM }}  # 使用 Repository Variables
        WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        VERIFY_STATS: ${{ inputs.verify_stats }}

      run: |
        if [ "$VERIFY_STATS" = "true" ]; then
          python verified_run.py
        else
          python run_until.py
        fi

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
